<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="HostelNexus - Smart Hostel Management System for BIET Engineering College">

    <meta name="author" content="HostelNexus">
    <meta name="csrf-token" content="{{ session.get('csrf_token', '') }}">

    <title>
        {% block title %}HostelNexus{% endblock %}
    </title>

    <!-- Main Stylesheet -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    {% block extra_css %}
    {% endblock %}
</head>

<body>

    <!-- Page Loading Overlay -->
    <div id="page-loader" class="page-loader">
        <div class="loader-content">
            <div class="loader-spinner"></div>
            <p>Loading HostelNexus...</p>
        </div>
    </div>


    <!-- Main Application Wrapper -->
    <div id="app">

        {% block content %}
        {% endblock %}

    </div>


    <!-- Toast Notification Container -->
    <div id="toast-container"
         class="toast-container">
    </div>


    <!-- Main JavaScript -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>

    {% block extra_js %}
    {% endblock %}

</body>
</html>
