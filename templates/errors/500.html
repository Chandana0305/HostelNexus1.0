{% extends "base.html" %}

{% block title %}
    Server Error | HostelNexus
{% endblock %}


{% block content %}

<div class="error-page">

    <div class="error-content">

        <div class="error-code">
            500
        </div>

        <h1>
            Something Went Wrong
        </h1>

        <p>
            HostelNexus encountered an unexpected error.
            Please try again.
        </p>

        <a href="{{ url_for('home') }}"
           class="btn btn-primary">
            Back to HostelNexus
        </a>

    </div>

</div>

{% endblock %}
